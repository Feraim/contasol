[project]
name = "contalibre"
version = "0.1.0"
description = "Contabilidad de código abierto para pymes y autónomos (España): PGC, diario, IVA, facturación, inmovilizado y API REST local."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "reportlab>=4.0",
    "openpyxl>=3.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
contalibre = "contalibre.main:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["contalibre*"]

[tool.setuptools.package-data]
contalibre = ["static/*"]
